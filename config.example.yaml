# Скопируйте в config.yaml и отредактируйте. Отсутствующие ключи берутся из значений по умолчанию.
timezone: Europe/Moscow

# 16 пар из исследования 2019 → сегодня (IMPROVEMENTS.md, раздел 7). BTC/USDT нужен фильтру режима BTC.
# Минимальный ордер OKX у всех ≤ 3 USDT (позиция = 30% от бюджета 10). У ETC/USDT низкая ликвидность на OKX.
symbols: [BTC/USDT, ETH/USDT, SOL/USDT, XRP/USDT, DOGE/USDT, ADA/USDT, LTC/USDT, LINK/USDT,
          AVAX/USDT, BCH/USDT, DOT/USDT, TRX/USDT, BNB/USDT, ETC/USDT, XLM/USDT, ZEC/USDT]

paths:
  db: data/bot.db
  logs: logs
  stop_file: STOP          # создайте этот файл -> аварийная остановка (закрыть всё, выключить trader)
  shutdown_file: SHUTDOWN  # создаёт stop.bat -> штатная остановка процесса
  heartbeat_file: data/heartbeat.json

logging: {level: INFO, max_bytes: 10000000, backup_count: 10}

exchange:
  ws_public: wss://ws.okx.com:8443/ws/v5/public
  ws_business: wss://ws.okx.com:8443/ws/v5/business
  taker_fee: 0.001         # 0.1% — используется для оценки комиссии выхода в нереализованном PnL

collector:
  timeframes: [1m, 5m, 1h]
  history: {1m: 1440, 5m: 864, 1h: 1000}   # сколько свечей подгрузить при первом старте (1h -> EMA200 на 4h)
  retention_days: {1m: 7, 5m: 30}
  stale_after_sec: 60      # нет тиков дольше -> новые входы на паузе

alerts:
  enabled: true
  price_move:              # движение цены > pct% за minutes минут
    - {pct: 2.0, minutes: 15}
    - {pct: 4.0, minutes: 60}
  levels: {enabled: true, windows: [24h, 7d], touch_pct: 0.3, bounce_pct: 0.8}
  rsi: {enabled: true, period: 14, overbought: 75, oversold: 25}     # на 1h
  volume_spike: {enabled: true, timeframe: 5m, multiplier: 3.0, lookback: 20}
  ema_cross: {enabled: true, fast: 50, slow: 200}                    # на 4h
  cooldown_minutes: {default: 60, price_move: 30, levels: 120, rsi: 240, volume_spike: 60, ema_cross: 720}

analytics:
  digest_enabled: true
  digest_time: "09:00"
  weekly_enabled: true
  weekly_day: sun
  weekly_time: "20:00"
  llm:
    enabled: false               # нужен ANTHROPIC_API_KEY в .env
    model: claude-opus-5-5
    effort: low
    max_tokens: 2000
    daily_budget_usd: 0.50       # дневной лимит расходов на токены
    price_input_per_mtok: 4.0    # $ за 1M входных токенов (для выбранной модели)
    price_output_per_mtok: 20.0
    refusal_fallback: true

trader:
  enabled: false                 # по умолчанию ВЫКЛЮЧЕН. Включение: здесь или /trader_on
  exchange_side_sl_tp: true      # OCO-ордер SL/TP на бирже (защищает, пока ПК спит)
  tick_interval_sec: 1
  # Стратегия: тренд EMA50/200 на 4h + вход на 1h. Принято по исследованию 2019 → сегодня (IMPROVEMENTS.md):
  # пробой 20-часового максимума, SL/TP по ATR(1h) (стоп не шире stop_loss_pct сессии), фильтр режима BTC.
  # Прежний вариант: entry_mode: pullback, exit_mode: fixed, btc_regime: false.
  strategy:
    ema_fast: 50
    ema_slow: 200
    rsi_period: 14
    rsi_pullback: 35           # для entry_mode: pullback
    rsi_max_entry: 60
    entry_mode: breakout       # pullback | breakout
    breakout_bars: 20
    rsi_max_breakout: 75
    exit_mode: atr             # fixed (SL/TP из сессии) | atr
    atr_period: 14
    atr_sl_mult: 2.0           # SL = min(stop_loss_pct, 2 × ATR1h)
    atr_tp_mult: 3.0           # TP = 3 × ATR1h
    min_atr_pct: 0             # фильтр ATR не прошёл проверку — выключен
    btc_regime: true           # альты только при аптренде BTC на 4h

  # Защиты входа (как Protections во Freqtrade). Только БЛОКИРУЮТ входы, лимиты сессии не ослабляют.
  # Выключены, пока scripts/evaluate_improvements.py не покажет улучшение out-of-sample на реальной истории.
  protections:
    enabled: false
    cooldown_minutes: 0              # CooldownPeriod: пауза по паре после любого выхода
    stoploss_guard: {enabled: false, lookback_hours: 24, trade_limit: 2, stop_minutes: 360, only_per_pair: false}
    low_profit_pairs: {enabled: false, lookback_hours: 72, trade_limit: 2, required_profit_pct: 0, stop_minutes: 1440}
    max_drawdown: {enabled: false, lookback_hours: 72, trade_limit: 3, max_drawdown_usdt: 1.0, stop_minutes: 720}

  # Барьеры выхода (triple barrier, как PositionExecutor в Hummingbot). Стоп только поднимается.
  # Трейлинг и безубыток выключены: не прошли проверку out-of-sample.
  exits:
    trailing_enabled: false
    trailing_activation_pct: 2.0
    trailing_distance_pct: 1.5
    breakeven_enabled: false
    breakeven_activation_pct: 1.5
    time_limit_hours: 6              # закрыть позицию через 6ч (принято по бэктесту; 0 = выкл)

# Динамический отбор пар OKX spot /USDT (как Pairlists во Freqtrade).
# Если enabled: false — торгуются symbols. Проверить выбор вручную: python scripts/select_pairs.py
pairlist:
  enabled: false
  refresh_hours: 6
  max_pairs: 4                       # 3–5
  candidates: 25                     # сколько самых ликвидных пар проверять детально
  min_quote_volume_usdt: 20000000    # суточный объём
  max_spread_pct: 0.10
  depth_band_pct: 1.0                # глубина стакана в пределах ±1% от середины
  min_depth_usdt: 50000              # на каждую сторону
  atr_period: 14                     # ATR% по дневным свечам
  min_atr_pct: 2.0
  max_atr_pct: 12.0
  min_listing_days: 90
  max_change_24h_pct: 25             # признаки памп/дампа
  max_volume_spike: 4.0              # объём 24ч / медиана за 30 дней
  max_daily_range_pct: 35
  whitelist: []                      # проверяются первыми (но всё равно фильтруются)
  blacklist: []                      # можно с масками: ["*DOG*/USDT"]

# Параметры сессии по умолчанию (/session_start переопределяет их)
session_defaults:
  budget_usdt: 10
  duration_hours: 8
  max_loss_usdt: 2
  max_loss_pct: null
  profit_target_usdt: 1.5
  profit_target_pct: null
  profit_lock: false
  profit_lock_trail_pct: 30
  max_trades: 10
  max_consecutive_losses: 3
  consecutive_loss_action: pause     # pause | stop
  consecutive_loss_pause_minutes: 60
  on_session_end: close_all          # close_all | manage_only
  manage_only_max_minutes: 60
  no_entry_last_hours: 4             # не открывать входы за 4ч до конца сессии (принято по бэктесту, см. IMPROVEMENTS.md)
  max_open_positions: 2
  position_size_pct: 30
  stop_loss_pct: 2
  take_profit_pct: 4

# Жёсткие потолки. Telegram НЕ может их превысить. Менять только здесь + перезапуск.
hard_caps:
  max_budget_usdt: 50
  max_loss_usdt: 10
  max_duration_hours: 24
  max_trades_per_session: 50
  max_position_size_pct: 30
  max_open_positions: 2

daily_caps:
  daily_budget_cap_usdt: 30     # сумма бюджетов всех сессий за день
  daily_loss_cap_usdt: 5        # суммарный убыток за день по всем сессиям

schedule:
  enabled: false
  start_time: "00:00"
  days: [mon, tue, wed, thu, fri, sat, sun]
  params: {budget_usdt: 10, duration_hours: 8}

health: {silent_alert_minutes: 5, check_interval_sec: 30}
telegram: {enabled: true}
